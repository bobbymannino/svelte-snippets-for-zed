on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  pr:
    name: Release Zed Extension
    runs-on: ubuntu-slim
    steps:
      - uses: huacnlee/zed-extension-action@v2
        with:
          extension-name: svelte-snippets
          push-to: bobbymannino/zed-extensions
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}

  release:
    needs: pr
    name: Github Release
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/release-notes.sh > release-notes.md
          cat release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file release-notes.md
